name: Windows build and release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Test and package Windows app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $packageVersion. Expected $expectedTag."
          }

      - name: Run tests
        run: npm test

      - name: Build Windows packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm exec electron-builder -- --win nsis portable --publish never

      - name: Generate Portable update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $portableName = "claude-cli-UI Portable $packageVersion.exe"
          $portablePath = Join-Path -Path release -ChildPath $portableName
          if (-not (Test-Path -LiteralPath $portablePath -PathType Leaf)) {
            throw "Portable package not found: $portablePath"
          }
          $portableFile = Get-Item -LiteralPath $portablePath
          $manifest = [ordered]@{
            version = $packageVersion
            fileName = $portableFile.Name
            size = $portableFile.Length
            sha256 = (Get-FileHash -LiteralPath $portablePath -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath release\portable-update.json -Encoding utf8

      - name: Upload Windows package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: claude-cli-UI-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/portable-update.json

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: claude-cli-UI-windows-${{ github.sha }}
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/portable-update.json
