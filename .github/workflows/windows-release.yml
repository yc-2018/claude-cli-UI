name: Windows build and release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Test and package Windows app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $packageVersion. Expected $expectedTag."
          }

      - name: Run tests
        run: npm test

      - name: Build Windows packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm exec electron-builder -- --win nsis portable --publish never

      - name: Generate Portable update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $portableDisplayName = "claude-cli-UI Portable $packageVersion.exe"
          $portablePath = Join-Path -Path release -ChildPath $portableDisplayName
          if (-not (Test-Path -LiteralPath $portablePath -PathType Leaf)) {
            throw "Portable package not found: $portablePath"
          }
          $portableAssetName = "claude-cli-UI-Portable-$packageVersion.exe"
          $portableAssetPath = Join-Path -Path release -ChildPath $portableAssetName
          Move-Item -LiteralPath $portablePath -Destination $portableAssetPath
          $portableFile = Get-Item -LiteralPath $portableAssetPath
          $manifest = [ordered]@{
            version = $packageVersion
            fileName = $portableDisplayName
            assetName = $portableFile.Name
            size = $portableFile.Length
            sha256 = (Get-FileHash -LiteralPath $portableAssetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath release\portable-update.json -Encoding utf8

      - name: Upload Windows package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: claude-cli-UI-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/portable-update.json

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: claude-cli-UI-windows-${{ github.sha }}
          path: release

      # Assets are uploaded one at a time: the parallel upload performed by
      # softprops/action-gh-release intermittently fails with "Error saving asset"
      # once several large binaries are pushed at once.
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          # Keep the release as a draft until every asset is verified, so a partial
          # upload is never visible to users or to the auto-updater.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; reusing it."
          else
            gh release create "$tag" --draft --verify-tag --generate-notes
          fi

          shopt -s nullglob
          assets=()
          for candidate in release/*.exe release/*.blockmap release/latest*.yml release/portable-update.json; do
            if [ -f "$candidate" ]; then
              assets+=("$candidate")
            fi
          done
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets found in release/" >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            name="${asset##*/}"
            uploaded=0
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$asset" --clobber; then
                uploaded=1
                break
              fi
              echo "::warning::Upload of $name failed (attempt $attempt/3)"
              sleep $((attempt * 15))
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "::error::Uploading $name failed after 3 attempts" >&2
              exit 1
            fi
          done

          expected="$(printf '%s\n' "${assets[@]##*/}" | sort)"
          actual="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release $tag does not carry the expected asset set" >&2
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

          gh release edit "$tag" --draft=false
          echo "Published $tag with ${#assets[@]} assets."
